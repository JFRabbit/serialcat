name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          asset="serialcat-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            asset="${asset}.exe"
          fi
          ver="${VERSION}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ver="${ver#v}"
          fi
          go build -trimpath \
            -ldflags "-X github.com/JFRabbit/serialcat/cmd.Version=${ver} -X github.com/JFRabbit/serialcat/cmd.DefaultUpdateURL=${{ github.repository }}" \
            -o "dist/${asset}" .
          shasum -a 256 "dist/${asset}" | tee "dist/${asset}.sha256"
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            docs/usage.md
            README.md
          body: |
            ## serialcat ${{ github.ref_name }}

            Lightweight local streaming log tool for serial port debugging. Single binary, cross-platform (Windows / macOS / Linux).

            ### Features

            - **Watch serial logs in real time**: run `serialcat agent serve` on the Windows machine that owns the serial device; pull the stream cross-platform with `source:serial-remote` (auto-reconnect with gap markers on disconnects).
            - **Filter logs locally**: read a file or a stream and regex-filter with `filter:grep`, then print to console or persist to disk.
            - **Send commands to the device**: `serialcat send` writes to the remote agent over HTTP (`/api/write`, with echo) or blind-sends directly to a local serial port.
            - **Read history**: the agent exposes `GET /api/logs` with paging, regex filtering, and tail snapshot of the persisted log.
            - **Self-update**: `serialcat update` checks the latest GitHub Release, verifies the SHA256 checksum, and replaces the current binary.

            ### Install

            Download the binary matching your platform from the assets below (`serialcat-{os}-{arch}`, Windows uses `.exe`), or build from source:

            ```bash
            go build -o serialcat .
            ```

            ### Docs

            - [README.md](https://github.com/JFRabbit/serialcat/blob/${{ github.ref_name }}/README.md)
            - [docs/usage.md](https://github.com/JFRabbit/serialcat/blob/${{ github.ref_name }}/docs/usage.md)
